services:
  app:
    image: ${IMAGE:-ghcr.io/nubitio/lycet:latest}
    container_name: ${CONTAINER_NAME:-lycet}
    restart: unless-stopped
    expose:
      - '8000'
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_SECRET: ${APP_SECRET}
      CLIENT_TOKEN: ${CLIENT_TOKEN}
      SOL_USER: ${SOL_USER}
      SOL_PASS: ${SOL_PASS}
      FE_URL: ${FE_URL:-https://e-factura.sunat.gob.pe/ol-ti-itcpfegem/billService}
      RE_URL: ${RE_URL:-https://e-factura.sunat.gob.pe/ol-ti-itemision-otroscpe-gem/billService}
      GUIA_URL: ${GUIA_URL:-https://e-factura.sunat.gob.pe/ol-ti-itemision-guia-gem/billService}
      AUTH_URL: ${AUTH_URL:-https://api-seguridad.sunat.gob.pe/v1}
      API_URL: ${API_URL:-https://api.sunat.gob.pe/v1}
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-.}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,REMOTE_ADDR}
      WKHTMLTOPDF_PATH: wkhtmltopdf
    volumes:
      - lycet-data:/var/www/html/data
    networks:
      - default
      - shared
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  lycet-data:
    driver: local

networks:
  default:
  shared:
    external: true
