name: Reusable Deploy

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy stack in Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          STACK_NAME: ${{ secrets.PORTAINER_STACK_NAME }}
          ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          COMPOSE_FILE: docker-compose.prod.yml
        run: |
          set -euo pipefail
          bash scripts/portainer-deploy.sh

      - name: Healthcheck
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "APP_URL not set; skipping healthcheck."
            exit 0
          fi

          echo "Waiting for application to become healthy..."
          sleep 10
          for i in {1..12}; do
            if curl -sf "${APP_URL}/" >/dev/null 2>&1; then
              echo "Healthy."
              exit 0
            fi
            echo "Attempt ${i}/12 failed. Retrying..."
            sleep 10
          done

          echo "Healthcheck failed."
          exit 1
